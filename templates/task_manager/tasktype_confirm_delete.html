{% extends "base.html" %}

{% block content %}
  <h1>Delete task type?</h1>
  <p>Are you sure you want to delete "{{ object }}"?</p>

  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
    <a href="{% url 'task_manager:task-type-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}

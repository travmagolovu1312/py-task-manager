<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">User: <a href="{% url 'task_manager:worker-detail' pk=user.pk %}">{{ user.username }}</a></li>
    <li class="list-group-item">
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-link p-0">Logout</button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item"><a href="{% url 'login' %}">Login</a></li>
  {% endif %}
  <br>
  <li class="list-group-item"><a href="{% url 'task_manager:index' %}">Home</a></li>
  <li class="list-group-item"><a href="{% url 'task_manager:task-list' %}">All tasks</a></li>
  <li class="list-group-item"><a href="{% url 'task_manager:worker-list' %}">All workers</a></li>
  <li class="list-group-item"><a href="{% url 'task_manager:position-list' %}">All positions</a></li>
  <li class="list-group-item"><a href="{% url 'task_manager:task-type-list' %}">All task types</a></li>
</ul>

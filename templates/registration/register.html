{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Register</h1>

  <form method="post" action="{% url 'task_manager:register' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Register" class="btn btn-primary">
  </form>

  <p class="mt-3">
    Already have an account? <a href="{% url 'login' %}">Login</a>
  </p>
{% endblock %}
